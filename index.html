<!DOCTYPE html>
<html lang="pt-br" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBHealth - Dashboard do Treinador</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: "#00d4ff",
            background: {
              light: "#f5f8f8",
              dark: "#000000",
            },
            card: {
              dark: "#0a0a0a",
              header: "#050505"
            }
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          },
          borderRadius: {
            '3xl': '32px',
            '4xl': '40px',
          },
          boxShadow: {
            'glow': '0 0 20px -5px rgba(0, 212, 255, 0.5)',
            'neon': '0 0 30px -10px rgba(0, 212, 255, 0.6)',
          },
          animation: {
            'kinetic-reveal': 'kineticReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-neon': 'pulseNeon 2s infinite',
          },
          keyframes: {
            kineticReveal: {
              '0%': { opacity: '0', transform: 'translateY(20px) scale(0.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            pulseNeon: {
              '0%, 100%': { boxShadow: '0 0 20px -5px rgba(0, 212, 255, 0.4)' },
              '50%': { boxShadow: '0 0 35px -2px rgba(0, 212, 255, 0.7)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .kinetic-border {
      position: relative;
      overflow: hidden;
    }

    .kinetic-border::after {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(90deg, transparent, #00d4ff, transparent);
      opacity: 0.3;
      z-index: -1;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-background-dark text-white selection:bg-primary/30 min-h-screen">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
