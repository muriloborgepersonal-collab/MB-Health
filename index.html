<!DOCTYPE html>
<html lang="pt-br" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBHealth - Dashboard do Treinador</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kanit:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .kinetic-border {
      position: relative;
      overflow: hidden;
    }

    .kinetic-border::after {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(90deg, transparent, #00d4ff, transparent);
      opacity: 0.3;
      z-index: -1;
    }
  </style>
</head>

<body class="bg-background-dark text-white selection:bg-primary/30 min-h-screen">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
